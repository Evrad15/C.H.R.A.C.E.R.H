name: crhacerh_mobile
description: Système de gestion des pointages hospitaliers - Application mobile Flutter

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Theming
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  provider: ^6.1.0
  
  # HTTP & API
  http: ^1.6.0
  dio: ^5.3.0
  
  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Storage
  shared_preferences: ^2.5.5
  sqflite: ^2.3.0
  
  # Biometrics (Face Recognition)
  local_auth: ^2.1.0
  
  # Camera (Optional)
  camera: ^0.10.5
  image: ^4.0.0
  
  # QR Scanner
  mobile_scanner: ^6.0.0
  
  # File Management
  file_picker: ^8.0.0
  open_filex: ^4.3.4+2
  path_provider: ^2.1.0
  permission_handler: ^11.3.0
  url_launcher: ^6.2.0
  
  # Navigation
  go_router: ^12.0.0
  
  # Validation
  form_validator: ^2.1.0
  
  # Date & Time
  intl: ^0.19.0
  
  # JSON Serialization
  json_serializable: ^6.7.0
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/